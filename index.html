<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tile Room Planner — Sign in</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:sans-serif;max-width:420px;margin:80px auto;padding:0 20px;color:#241f18;}
  input{width:100%;padding:10px;margin:10px 0;border:1px solid #ccc;border-radius:8px;}
  button{width:100%;padding:12px;border:none;border-radius:8px;background:#8c4a2a;color:#fff;font-weight:600;cursor:pointer;}
  button:hover{background:#6f3a20;}
  p.hint{font-size:13px;color:#8a8172;}
</style>
</head>
<body>

<h2>Tile Room Planner</h2>
<div id="app">Loading…</div>

<script>
  // Replace with your real Supabase project values (Settings → API)
  const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // safe to expose — governed by RLS

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const app = document.getElementById('app');

  async function init(){
    const { data: { session } } = await supabase.auth.getSession();
    if(!session){ return showLogin(); }
    checkSubscription(session.user);
  }

  function showLogin(){
    app.innerHTML = `
      <p>Enter your shop's email to sign in.</p>
      <input id="email" type="email" placeholder="you@shop.com" />
      <button onclick="sendMagicLink()">Send login link</button>
      <p class="hint" id="loginStatus"></p>
    `;
  }

  async function sendMagicLink(){
    const email = document.getElementById('email').value.trim();
    if(!email) return;
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href }
    });
    document.getElementById('loginStatus').textContent = error
      ? 'Something went wrong — try again.'
      : 'Check your email for a login link.';
  }

  async function checkSubscription(user){
    app.innerHTML = 'Checking your subscription…';
    const { data } = await supabase
      .from('subscriptions')
      .select('status, current_period_end')
      .eq('user_id', user.id)
      .maybeSingle();

    const isActive = data
      && data.status === 'active'
      && (!data.current_period_end || new Date(data.current_period_end) > new Date());

    if(isActive){
      window.location.href = '/tile-wall-planner.html';
    } else {
      showPaywall(user, data ? data.status : 'none');
    }
  }

  function showPaywall(user, currentStatus){
    const message = currentStatus === 'past_due'
      ? 'Your last payment didn\'t go through — please renew to keep using the planner.'
      : currentStatus === 'cancelled'
      ? 'Your subscription has ended — resubscribe to get back in.'
      : 'Subscribe to unlock the Tile Room Planner.';

    app.innerHTML = `
      <p>${message}</p>
      <button onclick="startCheckout('${user.id}', '${user.email}')">Subscribe — ₹999/month</button>
      <p class="hint" id="checkoutStatus"></p>
    `;
  }

  async function startCheckout(userId, email){
    document.getElementById('checkoutStatus').textContent = 'Starting checkout…';
    const res = await fetch('/api/create-subscription', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, email })
    });
    if(!res.ok){
      document.getElementById('checkoutStatus').textContent = 'Could not start checkout — try again.';
      return;
    }
    const { subscriptionId, keyId } = await res.json();

    const rzp = new Razorpay({
      key: keyId,
      subscription_id: subscriptionId,
      name: 'Tile Room Planner',
      description: 'Monthly subscription',
      theme: { color: '#8c4a2a' },
      handler: function(){
        document.getElementById('checkoutStatus').textContent =
          'Payment received — activating your account…';
        // Razorpay's webhook updates the database asynchronously, usually within seconds
        setTimeout(() => window.location.reload(), 3000);
      },
      modal: {
        ondismiss: function(){
          document.getElementById('checkoutStatus').textContent = 'Checkout closed.';
        }
      }
    });
    rzp.open();
  }

  init();
</script>
</body>
</html>
